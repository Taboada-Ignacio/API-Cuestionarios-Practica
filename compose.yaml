services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuestionarios
      POSTGRES_USER: cuestionarios
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cuestionarios_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuestionarios -d cuestionarios"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cuestionarios
      DB_USERNAME: cuestionarios
      DB_PASSWORD: ${DB_PASSWORD:-cuestionarios_local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
