# Proyecto de pruebas aislado; no comparte datos ni socket Docker.
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: cuestionarios_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d cuestionarios_test"]
      interval: 3s
      timeout: 5s
      retries: 20
  backend-tests:
    build:
      context: .
      target: test-runner
    environment:
      INTEGRATION_DB_URL: jdbc:postgresql://postgres-test:5432/cuestionarios_test
      INTEGRATION_DB_USERNAME: test
      INTEGRATION_DB_PASSWORD: test_local
    depends_on:
      postgres-test:
        condition: service_healthy
